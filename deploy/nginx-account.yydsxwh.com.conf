# 放到和 www.yydsxwh.com 同一台 nginx 上，只新增这个站点文件。
# 不要改 yyds-course / xiaowenhua.net / zhouyuding0825.com。
# 解析：account.yydsxwh.com  A 记录指向这台服务器 IP。
# 本机端口：3000=www 3001=xiaowenhua 3002=zhouyuding，账号中心用 3003。
# 证书可用 certbot --nginx -d account.yydsxwh.com

server {
    listen 80;
    listen [::]:80;
    server_name account.yydsxwh.com;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
